<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">BSA — Be Safe ASM</title>
<desc id="d">Pantera preta com contornos neon rosa sobre a sigla metálica BSA.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="70%">
    <stop offset="0" stop-color="#15121a"/>
    <stop offset=".65" stop-color="#08090d"/>
    <stop offset="1" stop-color="#030407"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".27" stop-color="#e7e7eb"/>
    <stop offset=".55" stop-color="#aeb3bb"/>
    <stop offset=".78" stop-color="#666c76"/>
    <stop offset="1" stop-color="#f1f2f4"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity=".75"/>
  </filter>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<!-- neon aura -->
<ellipse cx="820" cy="370" rx="520" ry="300" fill="none" stroke="#ff1681" stroke-width="5" opacity=".16" filter="url(#glow)"/>

<!-- panther -->
<g transform="translate(280 30)" filter="url(#shadow)">
  <!-- tail -->
  <path d="M370 380C160 560 20 520 45 385c18-98 119-150 215-122 73 21 122 99 78 156-35 46-122 50-169 4"
        fill="none" stroke="#ff2d84" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
  <!-- body -->
  <path d="M410 390C455 185 610 72 820 70c172-2 298 82 344 223 23 70 16 152-27 215-56 82-147 121-256 109-63-7-120-31-166-64-61-44-135-68-231-45-53 13-100 1-123-34-20-31-6-59 49-84Z"
        fill="#07080c" stroke="#ff2d84" stroke-width="13"/>
  <!-- head -->
  <path d="M815 102 885 30l70 92c45 4 88 21 121 49l92-25-37 103c22 38 29 79 21 118-13 71-65 128-139 149-76 21-154 2-204-49-44-45-61-105-49-162 11-54 43-102 89-132Z"
        fill="#050609" stroke="#ff2d84" stroke-width="12"/>
  <!-- ears -->
  <path d="M858 130 894 55l44 79M1067 136l75-12-40 63" fill="#050609" stroke="#ff2d84" stroke-width="10" stroke-linejoin="round"/>
  <!-- muzzle -->
  <path d="M910 351c32 20 67 22 102 0l30 39c-31 46-117 46-158 2Z" fill="#0c0f15" stroke="#ff2d84" stroke-width="7"/>
  <!-- eyes -->
  <path d="M847 263c36-20 75-17 108 10-38 7-67 3-108-10Zm177 8c32-26 71-30 106-11-38 15-70 18-106 11Z"
        fill="#ff2d84" filter="url(#glow)"/>
  <circle cx="904" cy="270" r="9" fill="#fff"/>
  <circle cx="1072" cy="269" r="9" fill="#fff"/>
  <!-- nose -->
  <path d="M963 338 991 354 1019 337 1011 365 991 378 970 365Z" fill="#171a20" stroke="#ff2d84" stroke-width="5"/>
  <!-- whiskers -->
  <path d="M927 381c-88 1-157 25-219 62M930 398c-84 18-151 49-206 91M1050 380c88-3 154 17 218 54M1047 397c86 16 151 43 207 85"
        stroke="#ff2d84" stroke-width="4" opacity=".7" fill="none"/>
  <!-- cyber traces -->
  <g stroke="#ff2d84" stroke-width="5" fill="none" opacity=".86">
    <path d="M560 251v84l35 29v67"/>
    <path d="M617 206v70l42 33v73"/>
    <path d="M692 165v53l34 28v63"/>
    <circle cx="560" cy="438" r="8"/><circle cx="617" cy="388" r="8"/><circle cx="726" cy="316" r="8"/>
  </g>
  <!-- foreleg/paw -->
  <path d="M737 489c89-25 183 12 218 85l-40 64-70-15-54 25-98-34c-25-44-8-99 44-125Z"
        fill="#06070a" stroke="#ff2d84" stroke-width="11"/>
  <path d="M809 572c4 49-18 81-43 88m102-75c5 44-14 73-36 85m98-69c4 34-10 58-30 70"
        fill="none" stroke="#ff2d84" stroke-width="9" stroke-linecap="round"/>
</g>

<!-- BSA -->
<g transform="translate(280 590)" filter="url(#shadow)">
  <text x="0" y="185" font-family="Arial Black, Impact, sans-serif" font-size="260" font-style="italic" font-weight="900"
        fill="url(#metal)" stroke="#11141a" stroke-width="8">BSA</text>
  <text x="5" y="185" font-family="Arial Black, Impact, sans-serif" font-size="260" font-style="italic" font-weight="900"
        fill="none" stroke="#ff2d84" stroke-width="4" opacity=".9"/>
  <path d="M20 210h1015" stroke="#ff2d84" stroke-width="8" opacity=".9" filter="url(#glow)"/>
  <text x="310" y="275" font-family="Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="18" fill="#f7f7f8">BE SAFE ASM</text>
</g>
</svg>