services:
  ollama:
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    container_name: bsa-ollama
    restart: unless-stopped
    volumes:
      - bsa_ollama:/root/.ollama
    networks: [bsa_ai_backend]

  ai-proxy:
    build: .
    container_name: bsa-ai-proxy
    restart: unless-stopped
    command: ["uvicorn", "app.ollama_proxy:app", "--host", "0.0.0.0", "--port", "11435"]
    env_file: .env
    environment:
      BSA_ENV: production
      BSA_OLLAMA_PROXY_TOKEN: ${BSA_OLLAMA_PROXY_TOKEN:?set BSA_OLLAMA_PROXY_TOKEN}
      BSA_OLLAMA_UPSTREAM_URL: http://ollama:11434
    expose:
      - "11435"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11435/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [bsa_ai_backend, bsa_ai_client]

  api:
    build: .
    container_name: bsa-api
    restart: unless-stopped
    env_file: .env
    environment:
      BSA_ENV: production
      BSA_MFA_KEY: ${BSA_MFA_KEY:?set BSA_MFA_KEY}
      BSA_AUTH_DB: /data/bsa_auth.db
      BSA_HISTORY_DB: /data/bsa_history.db
      BSA_STORE_DB: /data/bsa_store.db
      BSA_JOBS_DB: /data/bsa_jobs.db
      BSA_DEMO_DATA: "0"
      BSA_TRUST_PROXY_HEADERS: "1"
      BSA_AI_ENABLED: "1"
      BSA_OLLAMA_URL: http://ai-proxy:11435
      BSA_OLLAMA_PROXY_TOKEN: ${BSA_OLLAMA_PROXY_TOKEN:?set BSA_OLLAMA_PROXY_TOKEN}
    volumes:
      - bsa_data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      - ai-proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [bsa_ai_client, bsa_app, bsa_egress]


  worker:
    build: .
    container_name: bsa-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      BSA_ENV: production
      BSA_AUTH_DB: /data/bsa_auth.db
      BSA_HISTORY_DB: /data/bsa_history.db
      BSA_STORE_DB: /data/bsa_store.db
      BSA_JOBS_DB: /data/bsa_jobs.db
      BSA_DEMO_DATA: "0"
      BSA_AI_ENABLED: "0"
    volumes:
      - bsa_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.job_queue import worker_health; import sys; sys.exit(0 if worker_health().get('status') == 'healthy' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [bsa_egress]

  backup:
    build: .
    container_name: bsa-backup
    restart: unless-stopped
    command: ["python", "-m", "app.backup_scheduler"]
    env_file: .env
    environment:
      BSA_ENV: production
      BSA_AUTH_DB: /data/bsa_auth.db
      BSA_HISTORY_DB: /data/bsa_history.db
      BSA_STORE_DB: /data/bsa_store.db
      BSA_JOBS_DB: /data/bsa_jobs.db
      BSA_BACKUP_DIR: /backups
      BSA_BACKUP_INTERVAL_SECONDS: ${BSA_BACKUP_INTERVAL_SECONDS:-86400}
      BSA_BACKUP_RETENTION_DAYS: ${BSA_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - bsa_data:/data
      - bsa_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [bsa_app]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bsa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [bsa_app, bsa_edge]

volumes:
  bsa_ollama:
  bsa_data:
  bsa_backups:

networks:
  bsa_ai_backend:
    driver: bridge
    internal: true
  bsa_ai_client:
    driver: bridge
    internal: true
  bsa_app:
    driver: bridge
    internal: true
  bsa_egress:
    driver: bridge
  bsa_edge:
    driver: bridge
