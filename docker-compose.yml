services:
  ollama:
    image: ollama/ollama:latest
    container_name: bsa-ollama
    restart: unless-stopped
    volumes:
      - bsa_ollama:/root/.ollama

  api:
    build: .
    container_name: bsa-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BSA_ENV: development
      BSA_JWT_SECRET: "${BSA_JWT_SECRET:-dev-only-jwt-secret-change-before-production-123456}"
      BSA_ADMIN_EMAIL: "${BSA_ADMIN_EMAIL:-admin@besafe.local}"
      BSA_ADMIN_PASSWORD: "${BSA_ADMIN_PASSWORD:-Bsa-Dev-Only-2026!ChangeMe}"
      BSA_AUTH_DB: /data/bsa_auth.db
      BSA_HISTORY_DB: /data/bsa_history.db
      BSA_AI_ENABLED: "1"
      BSA_OLLAMA_URL: "http://ollama:11434"
      BSA_OLLAMA_MODEL: "qwen2.5:7b"
      BSA_AI_TIMEOUT: "15"
    volumes:
      - bsa_data:/data
    depends_on:
      - ollama

  api-full:
    profiles: ["full-engines"]
    build:
      context: .
      dockerfile: Dockerfile.engines
    container_name: bsa-api-full
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      BSA_AI_ENABLED: "1"
      BSA_OLLAMA_URL: "http://ollama:11434"
      BSA_OLLAMA_MODEL: "qwen2.5:7b"
      BSA_AI_TIMEOUT: "15"
      BSA_ENGINE_BUNDLE: "full"
      BSA_GVM_SOCKET: "/run/gvmd/gvmd.sock"
      BSA_CTI_URL: "${BSA_CTI_URL:-}"
      BSA_CTI_TOKEN: "${BSA_CTI_TOKEN:-}"
      BSA_LEAK_INTEL_URL: "${BSA_LEAK_INTEL_URL:-}"
      BSA_LEAK_INTEL_TOKEN: "${BSA_LEAK_INTEL_TOKEN:-}"
      BSA_THREATFOX_AUTH_KEY: "${BSA_THREATFOX_AUTH_KEY:-}"
    depends_on:
      - ollama

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bsa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  bsa_ollama:
  bsa_data:
