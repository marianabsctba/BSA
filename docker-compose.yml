services:
  ollama:
    image: ollama/ollama:0.35.0
    container_name: bsa-ollama
    restart: unless-stopped
    volumes:
      - bsa_ollama:/root/.ollama

  api:
    build: .
    container_name: bsa-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BSA_ENV: development
      BSA_JWT_SECRET: "${BSA_JWT_SECRET:?set BSA_JWT_SECRET}"
      BSA_ADMIN_EMAIL: "${BSA_ADMIN_EMAIL:-admin@besafe.local}"
      BSA_ADMIN_PASSWORD: "${BSA_ADMIN_PASSWORD:?set BSA_ADMIN_PASSWORD}"
      BSA_AUTH_DB: /data/bsa_auth.db
      BSA_HISTORY_DB: /data/bsa_history.db
      BSA_STORE_DB: /data/bsa_store.db
      BSA_JOBS_DB: /data/bsa_jobs.db
      BSA_DEMO_DATA: "${BSA_DEMO_DATA:-0}"
      BSA_AI_ENABLED: "1"
      BSA_OLLAMA_URL: "http://ollama:11434"
      BSA_OLLAMA_MODEL: "qwen2.5:7b"
      BSA_AI_TIMEOUT: "15"
    volumes:
      - bsa_data:/data
    depends_on:
      - ollama

  worker:
    build: .
    container_name: bsa-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      BSA_ENV: development
      BSA_AUTH_DB: /data/bsa_auth.db
      BSA_HISTORY_DB: /data/bsa_history.db
      BSA_STORE_DB: /data/bsa_store.db
      BSA_JOBS_DB: /data/bsa_jobs.db
      BSA_AI_ENABLED: "1"
      BSA_OLLAMA_URL: "http://ollama:11434"
    volumes:
      - bsa_data:/data
    depends_on:
      - ollama

  api-full:
    profiles: ["full-engines"]
    build:
      context: .
      dockerfile: Dockerfile.engines
    container_name: bsa-api-full
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      BSA_ENV: development
      BSA_JWT_SECRET: "${BSA_JWT_SECRET:?set BSA_JWT_SECRET}"
      BSA_ADMIN_EMAIL: "${BSA_ADMIN_EMAIL:-admin@besafe.local}"
      BSA_ADMIN_PASSWORD: "${BSA_ADMIN_PASSWORD:?set BSA_ADMIN_PASSWORD}"
      BSA_AUTH_DB: /data/bsa_auth.db
      BSA_HISTORY_DB: /data/bsa_history.db
      BSA_STORE_DB: /data/bsa_store.db
      BSA_JOBS_DB: /data/bsa_jobs.db
      BSA_DEMO_DATA: "${BSA_DEMO_DATA:-0}"
      BSA_AI_ENABLED: "1"
      BSA_OLLAMA_URL: "http://ollama:11434"
      BSA_OLLAMA_MODEL: "qwen2.5:7b"
      BSA_AI_TIMEOUT: "15"
      BSA_ENGINE_BUNDLE: "full"
      BSA_GVM_SOCKET: "/run/gvmd/gvmd.sock"
      BSA_CTI_URL: "${BSA_CTI_URL:-}"
      BSA_CTI_TOKEN: "${BSA_CTI_TOKEN:-}"
      BSA_LEAK_INTEL_URL: "${BSA_LEAK_INTEL_URL:-}"
      BSA_LEAK_INTEL_TOKEN: "${BSA_LEAK_INTEL_TOKEN:-}"
      BSA_THREATFOX_AUTH_KEY: "${BSA_THREATFOX_AUTH_KEY:-}"
    volumes:
      - bsa_data:/data
    depends_on:
      - ollama

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bsa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  bsa_ollama:
  bsa_data:
