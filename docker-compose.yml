services:
  api:
    build: .
    container_name: bsa-api
    restart: unless-stopped
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bsa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:

