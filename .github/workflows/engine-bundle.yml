name: Engine Bundle CI

concurrency:
  group: engine-bundle-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.engines"
      - "app/assessment_*.py"
      - "app/engine_health.py"
      - ".github/workflows/engine-bundle.yml"
  pull_request:
    paths:
      - "Dockerfile.engines"
      - "app/assessment_*.py"
      - "app/engine_health.py"

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build full engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.engines
          load: true
          tags: bsa-engines-ci:latest
          cache-from: type=gha,scope=engine-bundle
          cache-to: type=gha,mode=max,scope=engine-bundle
          provenance: false
      - name: Verify integrated binaries
        run: |
          docker run --rm --entrypoint sh bsa-engines-ci -lc '
            set -eu
            command -v nuclei
            command -v amass
            command -v httpx
            command -v subfinder
            command -v dnsx
            command -v naabu
            command -v tlsx
            command -v asnmap
            command -v katana
            command -v gau
            command -v trufflehog
            command -v assetfinder
            command -v alterx
            command -v puredns
            command -v massdns
            command -v nmap
            command -v whatweb
            command -v testssl.sh
            command -v zap-baseline.py
          '
      - name: Smoke engine executables
        run: |
          docker run --rm --entrypoint sh bsa-engines-ci -lc '
            set -eu
            smoke() {
              bin="$1"
              set +e
              timeout 20s "$bin" --help >/tmp/"$bin".help 2>&1
              code=$?
              set -e
              case "$code" in
                124) echo "$bin timed out during safe startup"; cat /tmp/"$bin".help || true; exit 1 ;;
                126|127) echo "$bin is not executable or could not be started (exit $code)"; cat /tmp/"$bin".help || true; exit 1 ;;
                137|139) echo "$bin crashed during safe startup (exit $code)"; cat /tmp/"$bin".help || true; exit 1 ;;
                *) test -s /tmp/"$bin".help || { echo "$bin produced no startup/help output (exit $code)"; exit 1; } ;;
              esac
            }
            for bin in nuclei amass httpx subfinder dnsx naabu tlsx asnmap katana gau trufflehog assetfinder alterx puredns massdns nmap whatweb testssl.sh zap-baseline.py; do
              smoke "$bin"
            done
          '
      - name: Verify engine version manifest
        run: |
          docker run --rm --entrypoint sh bsa-engines-ci -lc 'test -s /opt/bsa/engine-versions.txt && cat /opt/bsa/engine-versions.txt'
      - name: Import assessment stack
        run: |
          docker run --rm --entrypoint python bsa-engines-ci -c "from app.assessment_registry import registry; from app.assessment_orchestrator import PROFILES; print(len(registry.providers), sorted(PROFILES))"
