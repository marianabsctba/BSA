name: BSA CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall app
      - name: Verify product version consistency
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          from app.version import __version__

          root=pathlib.Path(".")
          expected=(root/"VERSION").read_text().strip()
          frontend=json.loads((root/"frontend/package.json").read_text())["version"]
          readme=(root/"README.md").read_text()
          assert __version__==expected, f"API version {__version__} != VERSION {expected}"
          assert frontend==expected, f"Frontend version {frontend} != VERSION {expected}"
          assert f"Versão atual:** `{expected}`" in readme, "README version is not aligned"
          PY

      - name: Backend tests with coverage baseline
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70

      - name: Ruff critical lint
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Mypy critical modules
        run: |
          mypy \
            app/observability.py \
            app/runtime_health.py \
            app/metrics.py \
            app/backup.py \
            app/backup_scheduler.py \
            --ignore-missing-imports \
            --follow-imports=skip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm config set registry https://registry.npmjs.org/
          npm cache verify
          npm install --no-fund --prefer-online
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Build web container
        run: docker build -t bsa-web-ci:local ./frontend

      - name: Validate nginx config
        run: docker run --rm --add-host api:127.0.0.1 bsa-web-ci:local nginx -t

      - name: Smoke test web container
        run: |
          docker run -d --name bsa-web-ci --add-host api:127.0.0.1 -p 127.0.0.1:18080:80 bsa-web-ci:local
          trap 'docker rm -f bsa-web-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/tmp/bsa-web-index.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/bsa-web-index.html
          grep -qi '<div id="root"></div>' /tmp/bsa-web-index.html
          curl --fail --silent --show-error http://127.0.0.1:18080/index.html >/dev/null

          asset_path="$(grep -oE '/assets/[^"]+' /tmp/bsa-web-index.html | head -n1)"
          test -n "$asset_path"
          for path in "/" "/index.html" "$asset_path"; do
            headers="$(curl --fail --silent --show-error -D - -o /dev/null "http://127.0.0.1:18080${path}" | tr -d '\r')"
            for header in Content-Security-Policy Strict-Transport-Security X-Frame-Options X-Content-Type-Options; do
              echo "$headers" | grep -qi "^${header}:"
            done
          done

      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: SAST
        run: |
          python -m pip install bandit
          bandit -q -r app -x tests -lll

      - name: Filesystem and dependency vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
