name: Resolve Image Digests

on:
  push:
    branches: [main]

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve immutable image digests
        run: |
          set -euo pipefail
          for image in             python:3.12-slim             node:22-alpine             nginx:1.27-alpine             ollama/ollama:0.35.0
          do
            echo "=== $image ==="
            docker buildx imagetools inspect "$image" | sed -n '1,12p'
          done
